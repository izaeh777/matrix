<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>call</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#111;overflow:hidden;font-family:sans-serif}
#remote,#local{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;visibility:hidden;pointer-events:none;border:0}
body.call-video #remote{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;background:#111;z-index:1;opacity:1;visibility:visible;pointer-events:none}
body.call-video #local{position:absolute;right:12px;top:12px;width:112px;height:152px;object-fit:cover;background:#000;z-index:2;border-radius:12px;border:2px solid rgba(255,255,255,.35);opacity:1;visibility:visible;pointer-events:none}
#remoteAudio{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
#ui,#acceptMask{display:none!important}
#ui #name{color:#fff;font-size:20px;font-weight:700;margin-bottom:6px}
#ui #sub{color:rgba(255,255,255,.75);font-size:14px;margin-bottom:16px}
#ui button{margin:0 8px 8px;padding:12px 22px;border:0;border-radius:24px;color:#fff;font-size:15px;font-weight:600}
#btnAccept{background:#07c160}
#btnReject,#btnHang{background:#fa5151}
#acceptMask{display:none;position:absolute;left:0;right:0;bottom:0;z-index:10;padding:24px 16px 36px;text-align:center;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.8))}
body.need-accept #acceptMask{display:block}
#acceptMask #accHint{color:#fff;font-size:16px;margin-bottom:14px}
#acceptMask #accBtn{padding:14px 56px;border:0;border-radius:28px;background:#07c160;color:#fff;font-size:18px;font-weight:700}
</style>
</head>
<body id="callEngineRoot" class="call-audio">
<video id="remote" autoplay playsinline webkit-playsinline muted></video>
<video id="local" autoplay playsinline webkit-playsinline muted></video>
<audio id="remoteAudio" autoplay playsinline></audio>
<div id="ui">
  <div id="name">通话</div>
  <div id="sub">连接中…</div>
  <div id="btns">
    <button id="btnAccept" type="button">接听</button>
    <button id="btnReject" type="button">拒绝</button>
    <button id="btnHang" type="button">挂断</button>
  </div>
</div>
<div id="acceptMask">
  <div id="accHint">点击接听以打开麦克风</div>
  <button id="accBtn" type="button">接听</button>
</div>
<script src="./call-engine.js"></script>
</body>
</html>
